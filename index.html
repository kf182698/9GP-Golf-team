<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9GP球隊 個人成績與歷史資料查詢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#182E4A', /* 高質感深藍色 */
                        accent: '#AE320B',  /* 專屬深磚紅色，用於請假與重要註記 */
                    }
                }
            }
        }
    </script>
    <style>
        /* 逐洞明細記號：平標準桿＝紅字無圈、博蒂＝紅字單圈、老鷹（含以下）＝紅字雙圈；柏忌以上黑字。
           尺寸用 em，跟著字體大小按鈕等比縮放。 */
        .score-mark { display: inline-flex; align-items: center; justify-content: center;
                      width: 1.7em; height: 1.7em; border-radius: 9999px; line-height: 1; }
        .score-par { color: #dc2626; }
        .score-mark.birdie { color: #dc2626; font-weight: 700; border: 1.5px solid #dc2626; }
        .score-mark.eagle  { color: #dc2626; font-weight: 700; border: 1.5px solid #dc2626;
                             outline: 1.5px solid #dc2626; outline-offset: 2px; }
    </style>
    <script>
        // 字體大小：Tailwind 以 rem 為單位，調整根字級即可整頁等比放大。
        // 選擇記在本機瀏覽器（localStorage），隱私模式讀不到時退回預設「中」。
        const FONT_LEVELS = [{ k: 'S', label: '小', pct: 100 }, { k: 'M', label: '中', pct: 115 },
                             { k: 'L', label: '大', pct: 130 }, { k: 'XL', label: '特大', pct: 150 }];
        const FONT_KEY = 'gp9_font';
        let fontK = 'M';
        try { fontK = localStorage.getItem(FONT_KEY) || 'M'; } catch (_) {}
        function getFontLevel() { return FONT_LEVELS.find(l => l.k === fontK) || FONT_LEVELS[1]; }
        document.documentElement.style.fontSize = getFontLevel().pct + '%';
        function setFontLevel(k) {
            fontK = k;
            try { localStorage.setItem(FONT_KEY, k); } catch (_) {}
            document.documentElement.style.fontSize = getFontLevel().pct + '%';
            renderFontButtons();
            if (typeof onFontChange === 'function') onFontChange();
        }
        function renderFontButtons() {
            const box = document.getElementById('fontBtns');
            if (!box) return;
            const cur = getFontLevel().k;
            box.innerHTML = '<span class="text-xs text-white/70 mr-1 whitespace-nowrap">字體</span>' + FONT_LEVELS.map(l =>
                `<button type="button" onclick="setFontLevel('${l.k}')" aria-pressed="${l.k === cur}"
                    class="whitespace-nowrap px-2 py-1 rounded text-sm font-semibold ${l.k === cur
                        ? 'bg-white text-primary' : 'bg-white/15 text-white'}">${l.label}</button>`).join('');
        }
        document.addEventListener('DOMContentLoaded', renderFontButtons);
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-12">

    <header class="bg-primary text-white p-6 shadow-md relative z-50">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4 mb-2 md:mb-0">
                <img src="./logo.png" onclick="showHome()" role="button" title="回首頁" alt="9GP球隊 Logo" class="w-14 h-14 rounded-full bg-white object-contain shadow-md border border-white/20 cursor-pointer">
                <div>
                    <h1 class="text-2xl font-bold tracking-wider cursor-pointer" onclick="showHome()" title="回首頁">9GP球隊 成績查詢系統</h1>
                    <div class="mt-1 text-sm text-white/80">成績更新日期：<span id="lastUpdatedDate">-</span></div>
                    <div id="fontBtns" class="mt-2 flex flex-wrap items-center gap-1" role="group" aria-label="字體大小"></div>
                </div>
            </div>
            
            <div class="w-full md:w-64 relative">
                <button id="playerSelectBtn" disabled class="w-full bg-white text-gray-800 p-3 rounded-lg font-semibold flex justify-between items-center shadow-md focus:outline-none border-2 border-transparent disabled:opacity-70">
                    <span id="selectedPlayerText">讀取資料中...</span>
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                
                <div id="playerList" class="hidden absolute left-0 right-0 mt-2 bg-white rounded-lg shadow-xl border border-gray-200 max-h-72 overflow-y-auto z-50">
                    </div>
            </div>
        </div>
    </header>

    <div id="statusMessage" class="max-w-5xl mx-auto mt-4 px-4 text-center text-accent font-bold hidden"></div>

    <!-- 最新例賽快報：載入即顯示，不必先選球員 -->
    <section id="latestMatch" class="max-w-5xl mx-auto mt-6 px-4 hidden">
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <div class="bg-primary text-white px-4 py-3 flex justify-between items-center">
                <h2 class="font-bold">🏌️ 最新例賽　<span id="latestTitle" class="font-normal text-white/80 text-sm"></span></h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50 text-gray-500 whitespace-nowrap">
                        <tr><th class="p-2">名次</th><th class="p-2 text-left">球員</th>
                        <th class="p-2">總桿</th><th class="p-2">差點</th><th class="p-2">淨桿</th><th class="p-2 text-left">獎項</th></tr>
                    </thead>
                    <tbody id="latestRows"></tbody>
                </table>
            </div>
        </div>

        <!-- 逐洞完整明細：資料來自 golf_scores.json 的「逐洞」欄，選定球員後隱藏 -->
        <div id="latestDetail" class="bg-white rounded-xl shadow overflow-hidden mt-4 hidden">
            <div class="bg-primary text-white px-4 py-3 flex justify-between items-center cursor-pointer" id="detailToggle">
                <h2 class="font-bold">📋 逐洞完整明細　<span id="detailSub" class="font-normal text-white/80 text-sm"></span></h2>
                <span id="detailCaret" class="text-white/80 text-sm">▲</span>
            </div>
            <div id="detailBody">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-gray-50 text-gray-500">
                            <tr id="detailHead"></tr>
                        </thead>
                        <tbody id="detailRows"></tbody>
                    </table>
                </div>
                <div class="px-4 py-2 text-xs text-gray-500 border-t flex flex-wrap gap-x-4 gap-y-1 items-center">
                    <span class="flex items-center gap-1"><span class="score-mark score-par">4</span>平標準桿 Par</span>
                    <span class="flex items-center gap-1"><span class="score-mark birdie">3</span>博蒂 Birdie（低於標準桿 1 桿）</span>
                    <span class="flex items-center gap-1"><span class="score-mark eagle">2</span>老鷹 Eagle（低於標準桿 2 桿以上）</span>
                </div>
            </div>
        </div>
    </section>

    <main id="mainContent" class="max-w-5xl mx-auto mt-6 px-4 hidden relative z-10">
        <button type="button" onclick="showHome()"
            class="mb-4 inline-flex items-center gap-1 bg-white text-primary font-semibold px-4 py-2 rounded-lg shadow border border-gray-200 active:bg-gray-100">
            ← 回首頁（最新例賽）
        </button>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-primary">
                <div class="text-sm text-gray-500">出賽總場次</div>
                <div class="text-2xl font-bold text-primary"><span id="statGames">0</span> <span class="text-sm text-gray-400 font-normal">/ 請假 <span id="statLeaves">0</span></span></div>
                <div id="statGuestNote" class="text-xs text-gray-400 mt-1"></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-primary">
                <div class="text-sm text-gray-500">平均總桿數</div>
                <div class="text-2xl font-bold text-primary" id="statAvgGross">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-accent">
                <div class="text-sm text-gray-500">生涯最佳成績</div>
                <div class="text-2xl font-bold text-accent" id="statBestGross">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-primary">
                <div class="text-sm text-gray-500">累計獲獎次數</div>
                <div class="text-2xl font-bold text-primary" id="statAwards">0</div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-4 rounded-xl shadow md:col-span-2">
                <h2 class="text-lg font-bold text-primary mb-4">總桿與差點走勢</h2>
                <!-- 固定高度容器：原本 canvas 依寬高比縮放，手機上只剩約 100px 高 -->
                <div class="relative w-full h-72 md:h-80">
                    <canvas id="scoreChart"></canvas>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow">
                <h2 class="text-lg font-bold text-accent mb-4">🏆 榮譽榜</h2>
                <ul id="awardList" class="space-y-3 overflow-y-auto max-h-64 pr-2">
                    </ul>
            </div>
        </div>

        <div>
            <h2 class="text-xl font-bold text-primary mb-4">賽事明細紀錄</h2>
            <div id="historyCards" class="space-y-4">
                </div>
        </div>

    </main>

    <script>
        // 現任會員：取最新一場例賽的全名冊列（publish.py 每場寫入全部會員，
        // 出賽者為名次、缺席者為「請假」；來賓為「來賓」不算會員）。
        // 名單隨 rules.yaml 名冊自動更新，不在網頁內寫死——
        // 符合「index.html 只讀 golf_scores.json」原則。
        let currentMembers = [];
        function deriveCurrentMembers() {
            const latestDate = golfData.map(d => d['賽事日期']).filter(Boolean).sort().at(-1);
            currentMembers = [...new Set(golfData
                .filter(d => d['賽事日期'] === latestDate && d['名次'] !== '來賓')
                .map(d => d['球員姓名']).filter(Boolean))]
                .sort((x, y) => x.localeCompare(y, 'zh-Hant'));
        }

        let golfData = [];
        let currentChart = null;

        // 頁面載入後，自動抓取 JSON 檔案
        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
        });

        async function fetchData() {
            const btn = document.getElementById('playerSelectBtn');
            const text = document.getElementById('selectedPlayerText');
            const statusMsg = document.getElementById('statusMessage');

            try {
                // 加上時間戳破除 LINE 與瀏覽器的強力快取，確保永遠抓到最新成績
                const cacheBuster = new Date().getTime();
                const response = await fetch(`./golf_scores.json?v=${cacheBuster}`);

                if (!response.ok) throw new Error('無法讀取 JSON');

                golfData = await response.json();
                updateLastUpdatedDate();
                deriveCurrentMembers();
                renderLatestMatch();  // 最新例賽快報（不必先選球員）
                initCustomSelect(); // 資料讀取成功，初始化選單
                openPlayerFromHash();

            } catch (error) {
                console.error('資料讀取錯誤: ', error);
                text.textContent = '資料載入失敗';
                statusMsg.textContent = '⚠️ 無法載入成績資料。請確認 golf_scores.json 檔案已上傳至同一個資料夾。';
                statusMsg.classList.remove('hidden');
            }
        }

        function updateLastUpdatedDate() {
            const latestDate = golfData
                .map(d => d['賽事日期'])
                .filter(Boolean)
                .sort((a, b) => new Date(b) - new Date(a))[0] || '-';
            document.getElementById('lastUpdatedDate').textContent = latestDate;
        }

        // 初始化客製化選單 (取代原生 select)
        function initCustomSelect() {
            const btn = document.getElementById('playerSelectBtn');
            const text = document.getElementById('selectedPlayerText');
            const list = document.getElementById('playerList');

            // 解除按鈕鎖定並更新預設文字
            btn.disabled = false;
            text.textContent = '-- 請點擊選擇球員 --';

            const players = [...new Set(golfData.map(d => d['球員姓名']).filter(Boolean))];
            const currentPlayerSet = new Set(currentMembers);
            const activePlayers = currentMembers.filter(name => players.includes(name));
            const formerPlayers = players.filter(name => !currentPlayerSet.has(name)).sort((a, b) => a.localeCompare(b, 'zh-Hant'));

            // 清空舊選單
            list.innerHTML = '';

            const appendPlayerItem = (player, isFormer = false) => {
                const item = document.createElement('div');
                item.className = isFormer
                    ? 'px-4 py-4 md:py-3 cursor-pointer text-gray-400 font-medium border-b border-gray-100 hover:bg-gray-50 active:bg-gray-200 transition-colors last:border-0'
                    : 'px-4 py-4 md:py-3 cursor-pointer text-gray-800 font-medium border-b border-gray-100 hover:bg-gray-50 active:bg-gray-200 transition-colors last:border-0';
                item.textContent = player;

                // 點擊球員後的動作
                item.addEventListener('click', (e) => {
                    e.stopPropagation(); // 防止事件冒泡
                    list.classList.add('hidden'); // 關閉選單
                    selectPlayer(player);
                });

                list.appendChild(item);
            };

            activePlayers.forEach(player => appendPlayerItem(player, false));

            if (formerPlayers.length > 0) {
                const divider = document.createElement('div');
                divider.className = 'px-4 py-2 text-xs font-semibold text-gray-400 bg-gray-50 border-b border-gray-100';
                divider.textContent = '前會員';
                list.appendChild(divider);

                formerPlayers.forEach(player => appendPlayerItem(player, true));
            }

            // 點擊按鈕展開/收合選單
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                list.classList.toggle('hidden');
            });

            // 點擊網頁其他空白處時，自動收合選單
            document.addEventListener('click', (e) => {
                if (!btn.contains(e.target) && !list.contains(e.target)) {
                    list.classList.add('hidden');
                }
            });
        }

        // 首頁（最新例賽）與個人頁切換。用 history 記錄，手機返回手勢可回首頁；
        // 網址帶 #player=姓名 時直接開該球員頁，方便分享連結。
        function selectPlayer(player, push = true) {
            document.getElementById('selectedPlayerText').textContent = player;
            document.getElementById('latestMatch').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            updateDashboard(player);
            window.scrollTo({ top: 0 });
            if (push) history.pushState({ player }, '', '#player=' + encodeURIComponent(player));
        }

        function showHome(push = true) {
            const text = document.getElementById('selectedPlayerText');
            if (!document.getElementById('playerSelectBtn').disabled) text.textContent = '-- 請點擊選擇球員 --';
            document.getElementById('playerList').classList.add('hidden');
            document.getElementById('mainContent').classList.add('hidden');
            document.getElementById('latestMatch').classList.remove('hidden');
            // 回首頁時逐洞明細恢復展開（若該場有逐洞資料）
            if (document.getElementById('detailRows').children.length) {
                document.getElementById('latestDetail').classList.remove('hidden');
                document.getElementById('detailBody').classList.remove('hidden');
                document.getElementById('detailCaret').textContent = '▲';
            }
            window.scrollTo({ top: 0 });
            if (push && location.hash) history.pushState({}, '', location.pathname + location.search);
        }

        const hashPlayer = () => {
            const m = /^#player=(.+)$/.exec(location.hash);
            return m ? decodeURIComponent(m[1]) : null;
        };
        window.addEventListener('popstate', e => {
            const p = e.state?.player || hashPlayer();
            if (p && golfData.some(d => d['球員姓名'] === p)) selectPlayer(p, false);
            else showHome(false);
        });

        function openPlayerFromHash() {
            const p = hashPlayer();
            if (p && golfData.some(d => d['球員姓名'] === p)) {
                history.replaceState({ player: p }, '', location.hash);
                selectPlayer(p, false);
            }
        }

        // 更新所有儀表板資訊
        function updateDashboard(playerName) {
            let playerData = golfData.filter(d => d['球員姓名'] === playerName);
            playerData.sort((a, b) => new Date(a['賽事日期']) - new Date(b['賽事日期']));

            // 入隊前以來賓身分出賽的場次：保留在明細紀錄，但不列入會員統計與走勢
            const guestGames = playerData.filter(d => d['名次'] === '來賓');
            const memberData = playerData.filter(d => d['名次'] !== '來賓');
            const playedGames = memberData.filter(d => d['總桿數'] !== null);
            const leaveGames = memberData.filter(d => d['名次'] === '請假' || d['總桿數'] === null);

            const totalGross = playedGames.reduce((sum, d) => sum + d['總桿數'], 0);
            const avgGross = playedGames.length ? (totalGross / playedGames.length).toFixed(1) : '-';
            const bestGross = playedGames.length ? Math.min(...playedGames.map(d => d['總桿數'])) : '-';
            const awards = playedGames.filter(d => d['所獲獎項'] !== null && d['所獲獎項'].trim() !== '');

            document.getElementById('statGames').textContent = playedGames.length;
            document.getElementById('statLeaves').textContent = leaveGames.length;
            document.getElementById('statGuestNote').textContent = guestGames.length
                ? `另有來賓身分 ${guestGames.length} 場，不列入統計` : '';
            document.getElementById('statAvgGross').textContent = avgGross;
            document.getElementById('statBestGross').textContent = bestGross;
            document.getElementById('statAwards').textContent = awards.length;

            renderChart(memberData);
            renderAwards(awards);
            renderHistoryCards([...playerData].reverse());
        }

        // 最新例賽快報：排名表（來賓標示、請假不列）
        function renderLatestMatch() {
            if (!golfData.length) return;
            const latestDate = golfData.map(d => d['賽事日期']).sort().at(-1);
            const rows = golfData
                .filter(d => d['賽事日期'] === latestDate && d['名次'] !== '請假')
                .sort((a, b) => {
                    const ra = a['名次'], rb = b['名次'];
                    if (typeof ra === 'number' && typeof rb === 'number') return ra - rb;
                    return (typeof ra === 'number') ? -1 : 1;  // 來賓排最後
                });
            document.getElementById('latestTitle').textContent =
                rows[0] ? rows[0]['例賽名稱'] : latestDate;
            document.getElementById('latestRows').innerHTML = rows.map(d => `
                <tr class="border-t ${d['名次'] === 1 ? 'bg-orange-50' : ''}">
                    <td class="p-2 text-center font-bold ${typeof d['名次'] === 'number' ? 'text-primary' : 'text-gray-400 text-xs'}">${d['名次']}</td>
                    <td class="p-2 font-semibold whitespace-nowrap">${d['球員姓名']}</td>
                    <td class="p-2 text-center font-mono">${d['總桿數'] ?? '—'}</td>
                    <td class="p-2 text-center font-mono text-gray-500">${d['差點'] ?? '—'}</td>
                    <td class="p-2 text-center font-mono">${d['淨桿數'] ?? '—'}</td>
                    <td class="p-2 text-sm text-accent">${d['所獲獎項'] ?? ''}</td>
                </tr>`).join('');
            document.getElementById('latestMatch').classList.remove('hidden');
            renderLatestDetail(rows);
        }

        // 逐洞完整明細：只在該場成績列帶有「逐洞」欄時顯示（舊場次無此資料）
        function renderLatestDetail(rows) {
            const section = document.getElementById('latestDetail');
            const played = rows.filter(d => Array.isArray(d['逐洞']) && d['逐洞'].length === 18);
            if (!played.length) { section.classList.add('hidden'); return; }

            const pars = played.find(d => Array.isArray(d['每洞標準桿']))?.['每洞標準桿'] || [];
            const sum9 = (a, s) => a.slice(s, s + 9).reduce((x, y) => x + (y ?? 0), 0);
            const parF = pars.length ? sum9(pars, 0) : null;
            const parB = pars.length ? sum9(pars, 9) : null;

            // 下場區域（如「西／東」）：三區球場每場組合不同，有記錄就顯示實際區名
            const zones = (played.find(d => d['下場區域'])?.['下場區域'] || '').split('／');
            const [zF, zB] = zones.length === 2 ? zones : ['前九', '後九'];
            document.getElementById('detailSub').textContent =
                `${played.length} 人${zones.length === 2 ? `　${zF}＋${zB}區` : ''}${pars.length ? `　PAR ${parF + parB}` : ''}`;

            // 表頭：H1–H9、前九、H10–H18、後九、總桿
            const th = (t, cls = '') => `<th class="p-2 ${cls}">${t}</th>`;
            document.getElementById('detailHead').innerHTML =
                th('球員', 'text-left sticky left-0 bg-gray-50') +
                pars.slice(0, 9).map((_, i) => th('H' + (i + 1))).join('') +
                th(zF, 'bg-gray-100') +
                pars.slice(9).map((_, i) => th('H' + (i + 10))).join('') +
                th(zB, 'bg-gray-100') + th('總桿', 'bg-gray-100');

            // 總桿低者在前（與明細表閱讀習慣一致）
            const sorted = [...played].sort((a, b) => (a['總桿數'] ?? 999) - (b['總桿數'] ?? 999));
            // 標準桿列：置於球員成績上方，淡藍底區隔，逐洞對照每人桿數
            const parCell = (v, cls = '') => `<td class="p-2 text-center font-mono text-sky-900 ${cls}">${v ?? '—'}</td>`;
            const parRow = pars.length ? `<tr class="bg-sky-50 border-b-2 border-sky-200">
                    <td class="p-2 font-semibold whitespace-nowrap sticky left-0 bg-sky-50 text-sky-900">標準桿</td>
                    ${pars.slice(0, 9).map(v => parCell(v)).join('')}
                    ${parCell(parF, 'font-bold bg-sky-100')}
                    ${pars.slice(9).map(v => parCell(v)).join('')}
                    ${parCell(parB, 'font-bold bg-sky-100')}
                    ${parCell(parF + parB, 'font-bold bg-sky-100')}
                </tr>` : '';

            document.getElementById('detailRows').innerHTML = parRow + sorted.map((d, idx) => {
                const h = d['逐洞'];
                const cell = (v, i) => {
                    const p = pars[i];
                    // 柏忌以上黑字；平標準桿紅字無圈、−1 博蒂紅字單圈、−2 以下老鷹紅字雙圈
                    let inner = v ?? '—';
                    if (p != null && v != null) {
                        const diff = v - p;
                        if (diff <= -2) inner = `<span class="score-mark eagle" title="老鷹 Eagle">${v}</span>`;
                        else if (diff === -1) inner = `<span class="score-mark birdie" title="博蒂 Birdie">${v}</span>`;
                        else if (diff === 0) inner = `<span class="score-par" title="平標準桿 Par">${v}</span>`;
                    }
                    return `<td class="p-2 text-center font-mono text-gray-900">${inner}</td>`;
                };
                const bg = idx === 0 ? 'bg-orange-50' : '';
                return `<tr class="border-t ${bg}">
                    <td class="p-2 font-semibold whitespace-nowrap sticky left-0 ${bg || 'bg-white'}">${d['球員姓名']}</td>
                    ${h.slice(0, 9).map((v, i) => cell(v, i)).join('')}
                    <td class="p-2 text-center font-mono font-bold bg-gray-50">${sum9(h, 0)}</td>
                    ${h.slice(9).map((v, i) => cell(v, i + 9)).join('')}
                    <td class="p-2 text-center font-mono font-bold bg-gray-50">${sum9(h, 9)}</td>
                    <td class="p-2 text-center font-mono font-bold bg-gray-50">${d['總桿數'] ?? '—'}</td>
                </tr>`;
            }).join('');

            section.classList.remove('hidden');

            // 標題列可收合表身（隱藏後仍能自行展開）
            const toggle = document.getElementById('detailToggle');
            toggle.onclick = () => {
                const body = document.getElementById('detailBody');
                const open = body.classList.toggle('hidden');
                document.getElementById('detailCaret').textContent = open ? '▼' : '▲';
            };
        }

        // 繪製走勢圖
        // 字體切換時重繪走勢圖（Chart.js 字級是 px，不跟根字級縮放）
        let lastChartData = null;
        function onFontChange() { if (lastChartData) renderChart(lastChartData); }

        function renderChart(data) {
            lastChartData = data;
            const scale = getFontLevel().pct / 100;
            const narrow = window.innerWidth < 640;
            Chart.defaults.font.size = Math.round(12 * scale);
            const ctx = document.getElementById('scoreChart').getContext('2d');

            if (currentChart) {
                currentChart.destroy();
            }

            // 軸範圍上下各留空間，避免點貼邊；刻度取整數、數量限制，手機上不重疊
            // 邊界對齊整數步長（總桿 5 桿、差點 2），刻度不會出現 120／122 這種擠在一起的尾數
            const range = (vals, pad, step, lo, hi) => {
                const v = vals.filter(x => typeof x === 'number');
                if (!v.length) return {};
                return { min: Math.max(lo, Math.floor((Math.min(...v) - pad) / step) * step),
                         max: Math.min(hi, Math.ceil((Math.max(...v) + pad) / step) * step) };
            };
            const gross = data.map(d => d['總桿數']);
            const hcp = data.map(d => d['差點']);
            const gR = range(gross, 1, 5, 50, 200);
            const hR = range(hcp, 1, 2, 0, 36);
            // 刻度間距：依範圍挑 5/10（總桿）、2/4（差點），手機上約 4~7 個刻度
            const stepFor = (r, small, big) => (r.max - r.min) / small > (narrow ? 6 : 8) ? big : small;
            // 日期標籤縮短為「26/11」，完整日期留在提示框
            const shortDate = s => s ? `${s.slice(2, 4)}/${s.slice(5, 7)}` : '';

            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d['賽事日期']),
                    datasets: [{
                        label: '總桿數（左軸）',
                        data: gross,
                        borderColor: '#182E4A',
                        backgroundColor: '#182E4A',
                        borderWidth: 2,
                        pointRadius: narrow ? 3 : 4,
                        pointHoverRadius: 6,
                        pointBackgroundColor: '#182E4A',
                        spanGaps: false,
                        cubicInterpolationMode: 'monotone',  // 平滑但不超出實際數值
                        yAxisID: 'y'
                    }, {
                        label: '差點（右軸）',
                        data: hcp,
                        borderColor: '#AE320B',
                        backgroundColor: '#AE320B',
                        borderWidth: 2,
                        borderDash: [6, 4],
                        pointRadius: narrow ? 2 : 3,
                        pointHoverRadius: 5,
                        spanGaps: true,
                        cubicInterpolationMode: 'monotone',  // 平滑但不超出實際數值
                        yAxisID: 'y2'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },  // 手指點到附近即顯示該場兩項數值
                    layout: { padding: { top: 4, right: 2 } },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: {
                                autoSkip: true, maxTicksLimit: narrow ? 5 : 10,
                                maxRotation: 0, minRotation: 0,
                                callback: function (v) { return shortDate(this.getLabelForValue(v)); }
                            }
                        },
                        y: {
                            reverse: true,   // 桿數越少越好，畫在上方
                            ...gR,
                            ticks: { stepSize: stepFor(gR, 5, 10), padding: 4 },
                            grid: { color: '#eef0f3' }
                        },
                        y2: {
                            position: 'right',
                            ...hR,
                            ticks: { stepSize: stepFor(hR, 2, 4), precision: 0, padding: 4 },
                            grid: { drawOnChartArea: false }
                        }
                    },
                    plugins: {
                        legend: { display: true, position: 'bottom',
                                  labels: { usePointStyle: true, pointStyle: 'line', boxWidth: 28, padding: 16 } },
                        tooltip: {
                            callbacks: {
                                title: items => items[0]?.label || '',
                                label: c => `${c.dataset.label.replace(/（.*）/, '')}：${c.parsed.y ?? '請假'}`
                            }
                        }
                    }
                }
            });
        }

        // 繪製榮譽榜
        function renderAwards(awards) {
            const list = document.getElementById('awardList');
            list.innerHTML = '';

            if (awards.length === 0) {
                list.innerHTML = '<li class="text-gray-400 text-sm">暫無獲獎紀錄</li>';
                return;
            }

            [...awards].reverse().forEach(a => {
                const li = document.createElement('li');
                li.className = 'border-b border-gray-100 pb-2 text-sm';
                li.innerHTML = `
                    <div class="text-xs text-gray-500">${a['賽事日期']}</div>
                    <div class="font-bold text-gray-800">${a['所獲獎項']} <span class="text-accent ml-1 text-xs">(總桿: ${a['總桿數']})</span></div>
                `;
                list.appendChild(li);
            });
        }

        // 繪製歷史明細卡片
        function renderHistoryCards(data) {
            const container = document.getElementById('historyCards');
            container.innerHTML = '';

            data.forEach(d => {
                const isLeave = (d['名次'] === '請假' || d['總桿數'] === null);

                const cardBg = isLeave ? 'bg-[#AE320B]/10 border-l-4 border-accent' : 'bg-white shadow border-l-4 border-transparent hover:border-primary transition-all';
                const textColor = isLeave ? 'text-accent font-bold' : 'text-gray-700';

                const card = document.createElement('div');
                card.className = `p-4 rounded-lg flex flex-col md:flex-row md:items-center justify-between gap-4 ${cardBg}`;

                let detailsHtml = '';
                if (isLeave) {
                    detailsHtml = `<div class="text-accent font-bold tracking-widest text-lg">請假</div>`;
                } else {
                    detailsHtml = `
                        <div class="grid grid-cols-4 gap-4 text-center w-full md:w-auto">
                            <div><span class="block text-xs text-gray-400 mb-1">總桿</span><span class="font-bold text-lg text-primary">${d['總桿數']}</span></div>
                            <div><span class="block text-xs text-gray-400 mb-1">淨桿</span><span class="font-semibold text-gray-600">${d['淨桿數'] ?? '—'}</span></div>
                            <div><span class="block text-xs text-gray-400 mb-1">差點</span><span class="text-sm text-gray-500">${d['差點'] ?? '—'}</span></div>
                            <div><span class="block text-xs text-gray-400 mb-1">名次</span><span class="font-bold text-accent">${d['名次']}</span></div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="md:w-1/3">
                        <div class="text-sm font-bold ${textColor}">${d['賽事日期']}</div>
                        <div class="text-sm text-gray-500">${d['例賽名稱']}</div>
                        ${d['名次'] === '來賓' ? `<div class="mt-1 inline-block bg-gray-100 text-gray-500 text-xs px-2 py-1 rounded mr-1">來賓身分（入隊前，不列入統計）</div>` : ''}
                        ${d['所獲獎項'] ? `<div class="mt-1 inline-block bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded">🏆 ${d['所獲獎項']}</div>` : ''}
                    </div>
                    <div class="md:w-2/3 flex justify-end items-center">
                        ${detailsHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
