<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9GP球隊 個人成績與歷史資料查詢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#182E4A', /* 高質感深藍色 */
                        accent: '#AE320B',  /* 專屬深磚紅色，用於請假與重要註記 */
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-12">

    <header class="bg-primary text-white p-6 shadow-md relative z-50">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4 mb-2 md:mb-0">
                <img src="./logo.png" alt="9GP球隊 Logo" class="w-14 h-14 rounded-full bg-white object-contain shadow-md border border-white/20">
                <div>
                    <h1 class="text-2xl font-bold tracking-wider">9GP球隊 成績查詢系統</h1>
                    <div class="mt-1 text-sm text-white/80">成績更新日期：<span id="lastUpdatedDate">-</span></div>
                </div>
            </div>
            
            <div class="w-full md:w-64 relative">
                <button id="playerSelectBtn" disabled class="w-full bg-white text-gray-800 p-3 rounded-lg font-semibold flex justify-between items-center shadow-md focus:outline-none border-2 border-transparent disabled:opacity-70">
                    <span id="selectedPlayerText">讀取資料中...</span>
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                
                <div id="playerList" class="hidden absolute left-0 right-0 mt-2 bg-white rounded-lg shadow-xl border border-gray-200 max-h-72 overflow-y-auto z-50">
                    </div>
            </div>
        </div>
    </header>

    <div id="statusMessage" class="max-w-5xl mx-auto mt-4 px-4 text-center text-accent font-bold hidden"></div>

    <!-- 最新例賽快報：載入即顯示，不必先選球員 -->
    <section id="latestMatch" class="max-w-5xl mx-auto mt-6 px-4 hidden">
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <div class="bg-primary text-white px-4 py-3 flex justify-between items-center">
                <h2 class="font-bold">🏌️ 最新例賽　<span id="latestTitle" class="font-normal text-white/80 text-sm"></span></h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50 text-gray-500">
                        <tr><th class="p-2">名次</th><th class="p-2 text-left">球員</th>
                        <th class="p-2">總桿</th><th class="p-2">淨桿</th><th class="p-2 text-left">獎項</th></tr>
                    </thead>
                    <tbody id="latestRows"></tbody>
                </table>
            </div>
        </div>
    </section>

    <main id="mainContent" class="max-w-5xl mx-auto mt-8 px-4 hidden relative z-10">
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-primary">
                <div class="text-sm text-gray-500">出賽總場次</div>
                <div class="text-2xl font-bold text-primary"><span id="statGames">0</span> <span class="text-sm text-gray-400 font-normal">/ 請假 <span id="statLeaves">0</span></span></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-primary">
                <div class="text-sm text-gray-500">平均總桿數</div>
                <div class="text-2xl font-bold text-primary" id="statAvgGross">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-accent">
                <div class="text-sm text-gray-500">生涯最佳成績</div>
                <div class="text-2xl font-bold text-accent" id="statBestGross">0</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-primary">
                <div class="text-sm text-gray-500">累計獲獎次數</div>
                <div class="text-2xl font-bold text-primary" id="statAwards">0</div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-4 rounded-xl shadow md:col-span-2">
                <h2 class="text-lg font-bold text-primary mb-4">總桿與差點走勢</h2>
                <canvas id="scoreChart" height="100"></canvas>
            </div>
            <div class="bg-white p-4 rounded-xl shadow">
                <h2 class="text-lg font-bold text-accent mb-4">🏆 榮譽榜</h2>
                <ul id="awardList" class="space-y-3 overflow-y-auto max-h-64 pr-2">
                    </ul>
            </div>
        </div>

        <div>
            <h2 class="text-xl font-bold text-primary mb-4">賽事明細紀錄</h2>
            <div id="historyCards" class="space-y-4">
                </div>
        </div>

    </main>

    <script>
        const currentMembers = [
            '王建亞',
            '陳翊彥',
            '黃予安',
            '劉韋廷',
            '陳奕仲',
            '曹勇良',
            '楊嘉一',
            '陳彥宇',
            '賀錫敬',
            '劉維智',
            '洪榮杰',
            '陳淂笙',
            '曾吟芳',
            '林家進',
            '何崇華'
        ];

        let golfData = [];
        let currentChart = null;

        // 頁面載入後，自動抓取 JSON 檔案
        document.addEventListener('DOMContentLoaded', () => {
            fetchData();
        });

        async function fetchData() {
            const btn = document.getElementById('playerSelectBtn');
            const text = document.getElementById('selectedPlayerText');
            const statusMsg = document.getElementById('statusMessage');

            try {
                // 加上時間戳破除 LINE 與瀏覽器的強力快取，確保永遠抓到最新成績
                const cacheBuster = new Date().getTime();
                const response = await fetch(`./golf_scores.json?v=${cacheBuster}`);

                if (!response.ok) throw new Error('無法讀取 JSON');

                golfData = await response.json();
                updateLastUpdatedDate();
                renderLatestMatch();  // 最新例賽快報（不必先選球員）
                initCustomSelect(); // 資料讀取成功，初始化選單

            } catch (error) {
                console.error('資料讀取錯誤: ', error);
                text.textContent = '資料載入失敗';
                statusMsg.textContent = '⚠️ 無法載入成績資料。請確認 golf_scores.json 檔案已上傳至同一個資料夾。';
                statusMsg.classList.remove('hidden');
            }
        }

        function updateLastUpdatedDate() {
            const latestDate = golfData
                .map(d => d['賽事日期'])
                .filter(Boolean)
                .sort((a, b) => new Date(b) - new Date(a))[0] || '-';
            document.getElementById('lastUpdatedDate').textContent = latestDate;
        }

        // 初始化客製化選單 (取代原生 select)
        function initCustomSelect() {
            const btn = document.getElementById('playerSelectBtn');
            const text = document.getElementById('selectedPlayerText');
            const list = document.getElementById('playerList');

            // 解除按鈕鎖定並更新預設文字
            btn.disabled = false;
            text.textContent = '-- 請點擊選擇球員 --';

            const players = [...new Set(golfData.map(d => d['球員姓名']).filter(Boolean))];
            const currentPlayerSet = new Set(currentMembers);
            const activePlayers = currentMembers.filter(name => players.includes(name));
            const formerPlayers = players.filter(name => !currentPlayerSet.has(name)).sort((a, b) => a.localeCompare(b, 'zh-Hant'));

            // 清空舊選單
            list.innerHTML = '';

            const appendPlayerItem = (player, isFormer = false) => {
                const item = document.createElement('div');
                item.className = isFormer
                    ? 'px-4 py-4 md:py-3 cursor-pointer text-gray-400 font-medium border-b border-gray-100 hover:bg-gray-50 active:bg-gray-200 transition-colors last:border-0'
                    : 'px-4 py-4 md:py-3 cursor-pointer text-gray-800 font-medium border-b border-gray-100 hover:bg-gray-50 active:bg-gray-200 transition-colors last:border-0';
                item.textContent = player;

                // 點擊球員後的動作
                item.addEventListener('click', (e) => {
                    e.stopPropagation(); // 防止事件冒泡
                    text.textContent = player;
                    list.classList.add('hidden'); // 關閉選單
                    document.getElementById('mainContent').classList.remove('hidden');
                    updateDashboard(player);
                });

                list.appendChild(item);
            };

            activePlayers.forEach(player => appendPlayerItem(player, false));

            if (formerPlayers.length > 0) {
                const divider = document.createElement('div');
                divider.className = 'px-4 py-2 text-xs font-semibold text-gray-400 bg-gray-50 border-b border-gray-100';
                divider.textContent = '前會員';
                list.appendChild(divider);

                formerPlayers.forEach(player => appendPlayerItem(player, true));
            }

            // 點擊按鈕展開/收合選單
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                list.classList.toggle('hidden');
            });

            // 點擊網頁其他空白處時，自動收合選單
            document.addEventListener('click', (e) => {
                if (!btn.contains(e.target) && !list.contains(e.target)) {
                    list.classList.add('hidden');
                }
            });
        }

        // 更新所有儀表板資訊
        function updateDashboard(playerName) {
            let playerData = golfData.filter(d => d['球員姓名'] === playerName);
            playerData.sort((a, b) => new Date(a['賽事日期']) - new Date(b['賽事日期']));

            const playedGames = playerData.filter(d => d['總桿數'] !== null);
            const leaveGames = playerData.filter(d => d['名次'] === '請假' || d['總桿數'] === null);

            const totalGross = playedGames.reduce((sum, d) => sum + d['總桿數'], 0);
            const avgGross = playedGames.length ? (totalGross / playedGames.length).toFixed(1) : 0;
            const bestGross = playedGames.length ? Math.min(...playedGames.map(d => d['總桿數'])) : '-';
            const awards = playedGames.filter(d => d['所獲獎項'] !== null && d['所獲獎項'].trim() !== '');

            document.getElementById('statGames').textContent = playedGames.length;
            document.getElementById('statLeaves').textContent = leaveGames.length;
            document.getElementById('statAvgGross').textContent = avgGross;
            document.getElementById('statBestGross').textContent = bestGross;
            document.getElementById('statAwards').textContent = awards.length;

            renderChart(playerData);
            renderAwards(awards);
            renderHistoryCards([...playerData].reverse());
        }

        // 最新例賽快報：排名表（來賓標示、請假不列）
        function renderLatestMatch() {
            if (!golfData.length) return;
            const latestDate = golfData.map(d => d['賽事日期']).sort().at(-1);
            const rows = golfData
                .filter(d => d['賽事日期'] === latestDate && d['名次'] !== '請假')
                .sort((a, b) => {
                    const ra = a['名次'], rb = b['名次'];
                    if (typeof ra === 'number' && typeof rb === 'number') return ra - rb;
                    return (typeof ra === 'number') ? -1 : 1;  // 來賓排最後
                });
            document.getElementById('latestTitle').textContent =
                rows[0] ? rows[0]['例賽名稱'] : latestDate;
            document.getElementById('latestRows').innerHTML = rows.map(d => `
                <tr class="border-t ${d['名次'] === 1 ? 'bg-orange-50' : ''}">
                    <td class="p-2 text-center font-bold ${typeof d['名次'] === 'number' ? 'text-primary' : 'text-gray-400 text-xs'}">${d['名次']}</td>
                    <td class="p-2 font-semibold">${d['球員姓名']}</td>
                    <td class="p-2 text-center font-mono">${d['總桿數'] ?? '—'}</td>
                    <td class="p-2 text-center font-mono">${d['淨桿數'] ?? '—'}</td>
                    <td class="p-2 text-sm text-accent">${d['所獲獎項'] ?? ''}</td>
                </tr>`).join('');
            document.getElementById('latestMatch').classList.remove('hidden');
        }

        // 繪製走勢圖
        function renderChart(data) {
            const ctx = document.getElementById('scoreChart').getContext('2d');

            if (currentChart) {
                currentChart.destroy();
            }

            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d['賽事日期']),
                    datasets: [{
                        label: '總桿數',
                        data: data.map(d => d['總桿數']),
                        borderColor: '#182E4A',
                        backgroundColor: '#182E4A',
                        borderWidth: 2,
                        pointRadius: 4,
                        pointBackgroundColor: '#AE320B',
                        spanGaps: false,
                        tension: 0.3,
                        yAxisID: 'y'
                    }, {
                        label: '差點',
                        data: data.map(d => d['差點']),
                        borderColor: '#AE320B',
                        backgroundColor: '#AE320B',
                        borderWidth: 2,
                        borderDash: [6, 4],
                        pointRadius: 3,
                        spanGaps: true,
                        tension: 0.3,
                        yAxisID: 'y2'
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            reverse: true,
                            title: { display: true, text: '總桿數' }
                        },
                        y2: {
                            position: 'right',
                            grid: { drawOnChartArea: false },
                            title: { display: true, text: '差點' }
                        }
                    },
                    plugins: {
                        legend: { display: true, position: 'bottom' }
                    }
                }
            });
        }

        // 繪製榮譽榜
        function renderAwards(awards) {
            const list = document.getElementById('awardList');
            list.innerHTML = '';

            if (awards.length === 0) {
                list.innerHTML = '<li class="text-gray-400 text-sm">暫無獲獎紀錄</li>';
                return;
            }

            [...awards].reverse().forEach(a => {
                const li = document.createElement('li');
                li.className = 'border-b border-gray-100 pb-2 text-sm';
                li.innerHTML = `
                    <div class="text-xs text-gray-500">${a['賽事日期']}</div>
                    <div class="font-bold text-gray-800">${a['所獲獎項']} <span class="text-accent ml-1 text-xs">(總桿: ${a['總桿數']})</span></div>
                `;
                list.appendChild(li);
            });
        }

        // 繪製歷史明細卡片
        function renderHistoryCards(data) {
            const container = document.getElementById('historyCards');
            container.innerHTML = '';

            data.forEach(d => {
                const isLeave = (d['名次'] === '請假' || d['總桿數'] === null);

                const cardBg = isLeave ? 'bg-[#AE320B]/10 border-l-4 border-accent' : 'bg-white shadow border-l-4 border-transparent hover:border-primary transition-all';
                const textColor = isLeave ? 'text-accent font-bold' : 'text-gray-700';

                const card = document.createElement('div');
                card.className = `p-4 rounded-lg flex flex-col md:flex-row md:items-center justify-between gap-4 ${cardBg}`;

                let detailsHtml = '';
                if (isLeave) {
                    detailsHtml = `<div class="text-accent font-bold tracking-widest text-lg">請假</div>`;
                } else {
                    detailsHtml = `
                        <div class="grid grid-cols-4 gap-4 text-center w-full md:w-auto">
                            <div><span class="block text-xs text-gray-400 mb-1">總桿</span><span class="font-bold text-lg text-primary">${d['總桿數']}</span></div>
                            <div><span class="block text-xs text-gray-400 mb-1">淨桿</span><span class="font-semibold text-gray-600">${d['淨桿數']}</span></div>
                            <div><span class="block text-xs text-gray-400 mb-1">差點</span><span class="text-sm text-gray-500">${d['差點']}</span></div>
                            <div><span class="block text-xs text-gray-400 mb-1">名次</span><span class="font-bold text-accent">${d['名次']}</span></div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="md:w-1/3">
                        <div class="text-sm font-bold ${textColor}">${d['賽事日期']}</div>
                        <div class="text-sm text-gray-500">${d['例賽名稱']}</div>
                        ${d['所獲獎項'] ? `<div class="mt-1 inline-block bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded">🏆 ${d['所獲獎項']}</div>` : ''}
                    </div>
                    <div class="md:w-2/3 flex justify-end items-center">
                        ${detailsHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
