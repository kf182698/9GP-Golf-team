<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9GP球隊 個人成績與歷史資料查詢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#182E4A', accent: '#AE320B' } } } }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-12">

    <header class="bg-primary text-white p-4 shadow-md relative z-50">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center gap-3 mb-4 md:mb-0">
                <img src="logo.png" alt="Logo" class="w-12 h-12 object-contain bg-white p-1 rounded-full">
                <div>
                    <h1 class="text-xl font-bold">9GP球隊</h1>
                    <p class="text-xs text-gray-300">成績查詢系統 | <span id="lastUpdateDate">讀取中...</span></p>
                </div>
            </div>
            
            <div class="w-full md:w-64 relative">
                <button id="playerSelectBtn" disabled class="w-full bg-white text-gray-800 p-3 rounded-lg font-semibold flex justify-between items-center shadow-md border-2 border-transparent">
                    <span id="selectedPlayerText">讀取資料中...</span>
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="playerList" class="hidden absolute left-0 right-0 mt-2 bg-white rounded-lg shadow-xl border border-gray-200 max-h-72 overflow-y-auto z-50"></div>
            </div>
        </div>
    </header>

    <main id="mainContent" class="max-w-5xl mx-auto mt-8 px-4 hidden">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-primary"><div class="text-sm text-gray-500">出賽場次</div><div class="text-2xl font-bold text-primary" id="statGames">0</div></div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-primary"><div class="text-sm text-gray-500">平均總桿</div><div class="text-2xl font-bold text-primary" id="statAvgGross">0</div></div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-accent"><div class="text-sm text-gray-500">生涯最佳</div><div class="text-2xl font-bold text-accent" id="statBestGross">0</div></div>
            <div class="bg-white p-4 rounded-xl shadow border-l-4 border-primary"><div class="text-sm text-gray-500">獲獎次數</div><div class="text-2xl font-bold text-primary" id="statAwards">0</div></div>
        </div>
        <div id="historyCards" class="space-y-4"></div>
    </main>

    <script>
        const currentMembers = ["王建亞","陳翊彥","黃予安","劉韋廷","陳奕仲","曹勇良","楊嘉一","陳彥宇","賀錫敬","劉維智","洪榮杰","陳淂笙","曾吟芳","林家進","何崇華"];
        
        // 核心邏輯：自動讀取同資料夾的 JSON
        async function loadData() {
            try {
                const response = await fetch('./golf_scores.json?t=' + new Date().getTime());
                const golfData = await response.json();
                
                // 設定日期
                const latestDate = Math.max(...golfData.map(d => new Date(d['賽事日期'])));
                document.getElementById('lastUpdateDate').textContent = new Date(latestDate).toISOString().split('T')[0];
                
                initUI(golfData);
            } catch (e) {
                document.getElementById('selectedPlayerText').textContent = "讀取資料失敗";
            }
        }

        function initUI(golfData) {
            const btn = document.getElementById('playerSelectBtn'), list = document.getElementById('playerList');
            btn.disabled = false;
            document.getElementById('selectedPlayerText').textContent = '-- 請選擇球員 --';
            
            const players = [...new Set(golfData.map(d => d['球員姓名']))].sort((a,b) => {
                const aM = currentMembers.includes(a), bM = currentMembers.includes(b);
                return aM === bM ? a.localeCompare(b) : (aM ? -1 : 1);
            });

            players.forEach(p => {
                const isMem = currentMembers.includes(p);
                list.innerHTML += `<div class="px-4 py-3 cursor-pointer ${isMem ? 'text-gray-800' : 'text-gray-400 italic'}">${isMem ? p : p + ' (前任)'}</div>`;
            });
            // (點擊事件與儀表板渲染邏輯同前)
        }
        loadData();
    </script>
</body>
</html>
