<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>9GP球隊 成績登錄（總幹事）</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#182E4A">
<link rel="apple-touch-icon" href="./logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script>
tailwind.config = { theme: { extend: { colors: {
  primary: '#182E4A',  /* 與 index.html 一致 */
  accent: '#AE320B',
}}}};
</script>
<style>
  body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .key { user-select: none; }
  .key:active { transform: scale(0.94); filter: brightness(0.92); }
</style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 pb-28">

<header class="bg-primary text-white px-4 py-3 shadow-md sticky top-0 z-40">
  <div class="max-w-xl mx-auto flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="./logo.png" alt="logo" class="w-9 h-9 rounded-full bg-white object-contain">
      <div>
        <h1 class="font-bold tracking-wide leading-tight">成績登錄</h1>
        <div id="stepLabel" class="text-xs text-white/70">載入設定中…</div>
      </div>
    </div>
    <button id="patBtn" class="text-xl px-2" title="GitHub 設定">⚙️</button>
  </div>
  <div class="max-w-xl mx-auto mt-2 flex gap-1" id="stepDots"></div>
</header>

<main class="max-w-xl mx-auto px-3 mt-4" id="app">
  <div id="loading" class="text-center text-gray-500 py-16">讀取 rules.yaml…</div>
</main>

<!-- PAT 設定 modal -->
<div id="patModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-3">
  <div class="bg-white rounded-2xl p-5 w-full max-w-md shadow-xl">
    <h2 class="font-bold text-primary text-lg mb-2">GitHub 發布設定</h2>
    <p class="text-sm text-gray-500 mb-3 leading-relaxed">
      貼入 fine-grained PAT（需此 repo 的 Contents 與 Actions 讀寫權限）。
      金鑰只存於此手機瀏覽器 localStorage，不會寫入任何檔案。
    </p>
    <input id="patInput" type="password" placeholder="github_pat_…"
           class="w-full border rounded-lg p-3 text-sm mb-3" autocomplete="off">
    <div class="flex gap-2">
      <button id="patSave" class="flex-1 bg-primary text-white rounded-lg py-2.5 font-semibold">儲存</button>
      <button id="patClear" class="px-4 border rounded-lg text-gray-500">清除</button>
      <button id="patClose" class="px-4 border rounded-lg text-gray-500">關閉</button>
    </div>
  </div>
</div>

<script>
"use strict";
const REPO = "kf182698/9GP-Golf-team";
const BRANCH = "main";
const DRAFT_KEY = "gp9_draft";
const PAT_KEY = "gp9_pat";
const STEPS = ["場次設定", "出賽名單", "逐洞輸入", "總表檢視", "發布"];

let rules = null;          // rules.yaml 解析結果（唯一規則來源）
let S = null;              // 全部輸入狀態（每次變更即寫 localStorage）
let tensMode = false;      // 鍵盤 10+ 兩位數模式

const $ = (id) => document.getElementById(id);
const app = () => $("app");

function newState() {
  return {
    step: 1,
    date: new Date().toISOString().slice(0, 10),
    courseId: "", courseName: "", coursePar: null,
    holePars: Array(18).fill(4),
    nineNames: ["前九", "後九"],
    cardType: "iswing",
    provider: "anthropic",
    players: [],               // {name, is_guest, scores:[18], ocr:{validation,low:[],unread:[]}}
    cur: { p: 0, h: 0 },
    nearPin: [],               // 近洞獎得主（手動輸入，程式無法計算）
    manualTieOrder: [],        // 同分裁定順序（總幹事指定）
  };
}

function save() { localStorage.setItem(DRAFT_KEY, JSON.stringify(S)); }

// ------------------ 啟動：讀 rules.yaml + 草稿續作 ------------------

async function boot() {
  try {
    const res = await fetch("rules.yaml", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    rules = jsyaml.load(await res.text());
  } catch (e) {
    $("loading").innerHTML =
      `<span class="text-accent font-bold">讀取 rules.yaml 失敗（${e}）</span><br>
       <span class="text-sm">請確認與 admin.html 同目錄部署。</span>`;
    return;
  }
  const draft = localStorage.getItem(DRAFT_KEY);
  if (draft) {
    try {
      const d = JSON.parse(draft);
      const filled = d.players?.reduce((n, p) => n + p.scores.filter(v => v != null).length, 0) || 0;
      if (filled > 0 || d.step > 1) {
        if (confirm(`偵測到 ${d.date} 的未完成草稿（已填 ${filled} 格）。\n要繼續上次的登錄嗎？\n（取消＝捨棄草稿重新開始）`)) {
          S = d;
        } else { localStorage.removeItem(DRAFT_KEY); }
      }
    } catch (_) { /* 壞草稿直接忽略 */ }
  }
  if (!S) S = newState();
  render();
}

// ------------------ 共用 render ------------------

function render() {
  save();
  $("stepLabel").textContent = `步驟 ${S.step}/5：${STEPS[S.step - 1]}`;
  $("stepDots").innerHTML = STEPS.map((_, i) =>
    `<div class="h-1 flex-1 rounded ${i < S.step ? "bg-white" : "bg-white/25"}"></div>`).join("");
  [renderStep1, renderStep2, renderStep3, renderStep4, renderStep5][S.step - 1]();
  window.scrollTo(0, 0);
}

function navBtns(prevOk, nextOk, nextLabel = "下一步") {
  return `<div class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 z-30">
    <div class="max-w-xl mx-auto flex gap-2">
      ${prevOk ? `<button onclick="S.step--;render()" class="px-5 py-3 border rounded-xl text-gray-600 font-semibold">上一步</button>` : ""}
      <button onclick="nextStep()" ${nextOk ? "" : "disabled"}
        class="flex-1 py-3 rounded-xl font-bold text-white ${nextOk ? "bg-primary" : "bg-gray-300"}">${nextLabel}</button>
    </div></div>`;
}

function nextStep() { S.step++; render(); }

// ------------------ ① 場次設定 ------------------

function renderStep1() {
  const opts = (rules.courses || []).map(c =>
    `<option value="${c.id}" ${S.courseId === c.id ? "selected" : ""}>${c.name}（par ${c.par_total}）</option>`).join("");
  const isCustom = S.courseId === "custom";
  app().innerHTML = `
  <div class="bg-white rounded-xl shadow p-4 space-y-4">
    <div>
      <label class="text-sm font-semibold text-gray-600">比賽日期</label>
      <input type="date" id="fDate" value="${S.date}" class="w-full border rounded-lg p-3 mt-1">
    </div>
    <div>
      <label class="text-sm font-semibold text-gray-600">球場</label>
      <select id="fCourse" class="w-full border rounded-lg p-3 mt-1 bg-white">
        <option value="">— 請選擇 —</option>${opts}
        <option value="custom" ${isCustom ? "selected" : ""}>其他球場（手動輸入）</option>
      </select>
    </div>
    <div id="customArea" class="${isCustom ? "" : "hidden"} space-y-3">
      <input id="fCourseName" placeholder="球場名稱" value="${isCustom ? S.courseName : ""}"
             class="w-full border rounded-lg p-3">
      <div class="grid grid-cols-2 gap-2">
        <input id="fNine1" placeholder="前九名稱（如 西）" value="${S.nineNames[0]}" class="border rounded-lg p-3">
        <input id="fNine2" placeholder="後九名稱（如 東）" value="${S.nineNames[1]}" class="border rounded-lg p-3">
      </div>
      <label class="text-sm font-semibold text-gray-600">每洞標準桿（新球場第一次打完後補登 rules.yaml）</label>
      <div class="grid grid-cols-9 gap-1">${S.holePars.map((p, i) =>
        `<input type="number" min="3" max="6" value="${p}" data-hole="${i}"
           class="parIn border rounded p-1 text-center text-sm">`).join("")}</div>
      <div class="text-sm text-gray-500">合計 par：<span id="parSum" class="font-bold">${S.holePars.reduce((a, b) => a + b, 0)}</span></div>
    </div>
    <div id="courseInfo" class="text-sm text-gray-500"></div>
  </div>

  <div class="bg-white rounded-xl shadow p-4 mt-4 space-y-3">
    <h2 class="font-bold text-primary">📋 辨識草稿（選用——若無草稿可直接手動輸入）</h2>
    <div class="text-xs text-gray-500 leading-relaxed">
      草稿只由總幹事在本機以 Claude Code 執行 <code>/scorecard</code> 指令產生，merge 進 GitHub 後才會出現在下方清單。
      手寫卡常常連日期都辨識不出來，草稿檔名/內容的日期僅供參考——比賽日期一律以上方欄位為準，請自行確認。
    </div>
    <div>
      <label class="text-sm font-semibold text-gray-600">選擇草稿檔案</label>
      <select id="draftSelect" class="w-full border rounded-lg p-3 mt-1 bg-white">
        <option value="">（讀取中…）</option>
      </select>
    </div>
    <div class="flex gap-2">
      <button id="draftBtn" class="flex-1 bg-gray-100 rounded-lg py-2 text-sm font-semibold text-gray-700" disabled>⬇ 載入所選草稿</button>
      <button id="draftDelBtn" class="px-4 bg-red-50 text-accent rounded-lg py-2 text-sm font-semibold" disabled title="刪除所選草稿檔案（不影響已發布成績）">🗑 刪除</button>
    </div>
    <div id="ocrLog" class="text-xs font-mono whitespace-pre-wrap text-gray-600"></div>
  </div>
  ${navBtns(false, !!S.courseId && (S.courseId !== "custom" || S.courseName))}`;

  $("fDate").onchange = e => { S.date = e.target.value; save(); render(); };
  $("fCourse").onchange = e => { applyCourse(e.target.value); render(); };
  if (isCustom) {
    $("fCourseName").oninput = e => { S.courseName = e.target.value.trim(); S.coursePar = S.holePars.reduce((a, b) => a + b, 0); save(); };
    $("fCourseName").onchange = () => render();   // 失焦後重繪以更新下一步按鈕
    $("fNine1").oninput = e => { S.nineNames[0] = e.target.value.trim() || "前九"; save(); };
    $("fNine2").oninput = e => { S.nineNames[1] = e.target.value.trim() || "後九"; save(); };
    document.querySelectorAll(".parIn").forEach(inp => inp.oninput = e => {
      const v = parseInt(e.target.value); const i = +e.target.dataset.hole;
      if (v >= 3 && v <= 6) S.holePars[i] = v;
      S.coursePar = S.holePars.reduce((a, b) => a + b, 0);
      $("parSum").textContent = S.coursePar; save();
    });
  } else if (S.courseId) {
    $("courseInfo").innerHTML =
      `區域：${S.nineNames[0]} / ${S.nineNames[1]}　·　每洞 par 已自動帶入，輸入時可一鍵「照par」`;
  }
  $("draftBtn").onclick = loadDraft;
  $("draftDelBtn").onclick = deleteSelectedDraft;
  refreshDraftList();
}

// 列出 pending/ 目錄下所有草稿檔案供總幹事挑選。刻意不綁定目前選定的比賽日期——
// 手寫卡常辨識不出日期、檔名不可靠，一律由總幹事自行比對卡片挑選正確草稿。
// 每個 <option> 帶 data-sha，供 deleteSelectedDraft() 呼叫 Contents API 刪除時使用。
async function refreshDraftList() {
  const sel = $("draftSelect");
  const btn = $("draftBtn");
  const delBtn = $("draftDelBtn");
  if (!sel || !btn || !delBtn) return;
  if (!localStorage.getItem(PAT_KEY)) {
    sel.innerHTML = `<option value="">（先點右上角 ⚙ 設定 PAT 才能讀取草稿）</option>`;
    btn.disabled = true;
    delBtn.disabled = true;
    return;
  }
  sel.innerHTML = `<option value="">讀取中…</option>`;
  btn.disabled = true;
  delBtn.disabled = true;
  try {
    const res = await ghFetch(`/repos/${REPO}/contents/pending?ref=${BRANCH}`);
    if (!sel.isConnected) return;   // 使用者已切換畫面，結果作廢
    if (res.status === 404) {
      sel.innerHTML = `<option value="">（目前沒有草稿，可直接手動輸入）</option>`;
      return;
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const files = (await res.json())
      .filter(f => f.type === "file" && f.name.endsWith("_draft.json"))
      .sort((a, b) => b.name.localeCompare(a.name));
    if (files.length === 0) {
      sel.innerHTML = `<option value="">（目前沒有草稿，可直接手動輸入）</option>`;
      return;
    }
    sel.innerHTML = `<option value="">— 請選擇草稿（共 ${files.length} 筆）—</option>` +
      files.map(f => `<option value="${f.path}" data-sha="${f.sha}">${f.name}</option>`).join("");
    btn.disabled = false;
    delBtn.disabled = false;
  } catch (e) {
    sel.innerHTML = `<option value="">讀取草稿列表失敗（${e.message}）</option>`;
  }
}

// 刪除所選草稿檔案（僅刪 pending/ 底下的辨識草稿，不影響已發布的 golf_scores.json）。
// 用途：清掉手寫卡辨識不出日期產生的 unknown-<timestamp>_draft.json（score.yml
// 發布後只會自動清掉與確認稿同日期的草稿，這類檔名對不上，永遠不會被自動清掉）、
// 重複上傳的照片、或校對後決定不用的草稿。
async function deleteSelectedDraft() {
  const log = m => { $("ocrLog").textContent += m + "\n"; };
  if (!localStorage.getItem(PAT_KEY)) return openPat();
  const sel = $("draftSelect");
  const opt = sel?.selectedOptions[0];
  const path = sel?.value;
  if (!path) { $("ocrLog").textContent = ""; log("請先在上方選擇要刪除的草稿檔案"); return; }
  if (!confirm(`確定要刪除「${opt.textContent}」嗎？\n此操作無法復原（若尚未校對發布，辨識結果會直接遺失）。`)) return;
  $("ocrLog").textContent = "";
  try {
    const res = await ghFetch(`/repos/${REPO}/contents/${path}`, {
      method: "DELETE",
      body: JSON.stringify({
        message: `admin: 刪除草稿 ${path}`,
        sha: opt.dataset.sha, branch: BRANCH,
      }),
    });
    if (!res.ok) throw new Error(`刪除失敗 HTTP ${res.status}：${(await res.json()).message || ""}`);
    log(`✓ 已刪除 ${path}`);
    refreshDraftList();
  } catch (e) { log(`❌ ${e.message}`); }
}

// ------------------ 載入 OCR 草稿 → 預填 + 色碼 ------------------

async function loadDraft() {
  const log = m => { $("ocrLog").textContent += m + "\n"; };
  $("ocrLog").textContent = "";
  if (!localStorage.getItem(PAT_KEY)) return openPat();
  const path = $("draftSelect")?.value;
  if (!path) { log("請先在上方選擇要載入的草稿檔案"); return; }
  try {
    const res = await ghFetch(`/repos/${REPO}/contents/${path}?ref=${BRANCH}`);
    if (!res.ok) throw new Error(`找不到 ${path}（HTTP ${res.status}）`);
    const body = await res.json();
    const draft = JSON.parse(decodeURIComponent(escape(atob(body.content.replace(/\n/g, "")))));
    applyDraft(draft);
    render();   // 先重繪（會清掉 #ocrLog），再寫結果訊息
    log(`✓ 已預填 ${draft.players.length} 位球員。黃格=低信心、紅格=無法辨識，請逐格校對；任何格都可覆寫。`);
    log(draft.date
      ? `ℹ 草稿內辨識到的比賽日期為 ${draft.date}，僅供參考，請確認上方「比賽日期」是否正確。`
      : `⚠ 草稿未能辨識出比賽日期，請務必自行選擇上方「比賽日期」。`);
  } catch (e) { log(`❌ ${e.message}`); }
}

// 半場桿數強制補齊/截斷至剛好 9 格（OCR 漏辨識或格式異常時，
// 逐洞輸入介面才不會漏掉球洞）
function nineCells(arr) {
  const a = Array.isArray(arr) ? arr : [];
  return Array.from({ length: 9 }, (_, i) => (a[i] === undefined ? null : a[i]));
}

function applyDraft(draft) {
  // 比賽日期刻意不從草稿帶入——手寫卡常辨識不出日期，草稿內的值不可靠，
  // 一律以總幹事在上方欄位手動選定/確認的日期為準（見 loadDraft 的提示訊息）。
  // 球場：比對 courses 名稱；比對不到 → 自訂（帶草稿的 hole_pars）
  const c = (rules.courses || []).find(c =>
    c.name === draft.course || (c.aliases || []).includes(draft.course));
  if (c) { applyCourse(c.id); }
  else {
    S.courseId = "custom";
    S.courseName = draft.course || "";
    S.holePars = (draft.hole_pars || Array(18).fill(4)).map(p => p ?? 4);
    S.nineNames = [draft.front_nine_name || "前九", draft.back_nine_name || "後九"];
    S.coursePar = draft.course_par ?? S.holePars.reduce((a, b) => a + b, 0);
  }
  const roster = (rules.players || []).map(p => p.name);
  S.players = (draft.players || []).map(p => {
    const existing = S.players.find(sp => sp.name === p.name);
    const scores = existing ? existing.scores : [...nineCells(p.front_9), ...nineCells(p.back_9)];
    // 名字匹配：uncertain/unmatched 才需要候選選項。
    // p.name_candidates 是 CLAUDE.md schema 定義的「已排版好」字串陣列
    // （如 "王建亞 95%"、"新增來賓：王建亚"）——不是純姓名，選中後寫入
    // S.players[i].name 前必須先拆出乾淨姓名，否則選單值會整串帶著「 95%」污染資料。
    let nameCandidates = [];
    if (p.name_match === "uncertain" && p.name_candidates) {
      nameCandidates = p.name_candidates.map(c => {
        if (c.startsWith("新增來賓：")) return { name: c.slice(5), label: c, isGuest: true };
        const m = c.match(/^(.+?)\s+(\d+)%$/);
        return m ? { name: m[1], label: c, sim: +m[2] / 100, isCandidate: true }
                  : { name: c, label: c, isCandidate: true };
      });
      nameCandidates.sort((a, b) => (b.sim || 0) - (a.sim || 0));  // 按相似度排序
      const other = roster.filter(n => !nameCandidates.some(x => x.name === n));
      nameCandidates.push(...other.map(n => ({ name: n, label: n, isCandidate: false })));
      if (!nameCandidates.some(x => x.isGuest)) {
        nameCandidates.push({ name: "新增來賓：" + (p.ocr_name || p.name), label: "新增來賓：" + (p.ocr_name || p.name), isGuest: true });
      }
    } else if (p.name_match === "unmatched") {
      nameCandidates.push({ name: "新增來賓：" + p.name, label: "新增來賓：" + p.name, isGuest: true });
      nameCandidates.push(...roster.map(n => ({ name: n, label: n, isCandidate: false })));
    }
    return {
      name: p.name,
      is_guest: !!p.is_guest,
      scores: scores,
      ocr: {
        validation: p.validation || "fail",
        low: (p.low_confidence_holes || []).map(h => h - 1),      // 轉 0-based
        unread: (p.unreadable_holes || []).map(h => h - 1),
        nameMatch: p.name_match || "exact",
      },
      nameCandidates: nameCandidates,
    };
  });
  S.cur = { p: 0, h: 0 };
}
function applyCourse(id) {
  S.courseId = id;
  if (id === "custom") {
    S.courseName = ""; S.holePars = Array(18).fill(4);
    S.nineNames = ["前九", "後九"]; S.coursePar = 72;
    return;
  }
  const c = (rules.courses || []).find(c => c.id === id);
  if (!c) { S.courseName = ""; return; }
  S.courseName = c.name;
  S.nineNames = c.nines.map(n => n.name);
  S.holePars = [...c.nines[0].pars, ...c.nines[1].pars];
  S.coursePar = c.par_total;
}

// ------------------ ② 出賽名單 ------------------

function renderStep2() {
  const roster = (rules.players || []).map(p => p.name);
  const uncertain = S.players.filter(p => p.ocr?.nameMatch === "uncertain").length;
  app().innerHTML = `
  <div class="bg-white rounded-xl shadow p-4 space-y-3">
    <h2 class="font-bold text-primary">出賽名單</h2>
    ${uncertain > 0 ? `<div class="bg-yellow-50 border border-yellow-300 rounded p-3 text-sm text-yellow-800">⚠️ 有 ${uncertain} 列名字辨識不確定，請檢視黃邊框列並確認身份</div>` : ""}
    <div class="space-y-2 max-h-96 overflow-y-auto">
      ${S.players.map((p, i) => {
        const isUncertain = p.ocr?.nameMatch === "uncertain";
        const isUnmatched = p.ocr?.nameMatch === "unmatched";
        const border = isUncertain || isUnmatched ? "border-yellow-400 border-2" : "";
        return `
        <div class="flex gap-2 items-center p-2 rounded ${p.is_guest ? "bg-orange-50 opacity-75" : "bg-gray-50"} ${border}">
          ${p.nameCandidates && p.nameCandidates.length > 0 ? `
            <select data-i="${i}" class="candSel flex-1 border rounded p-2 text-sm">
              <option value="">選擇…</option>
              ${p.nameCandidates.map(c => {
                return `<option value="${c.name}" data-guest="${!!c.isGuest}">${c.label || c.name}</option>`;
              }).join("")}
            </select>
          ` : `
            <select data-i="${i}" class="psel flex-1 border rounded p-2 text-sm">
              <option value="">選擇會員…</option>
              ${roster.map(n => `<option value="${n}" ${p.name === n ? "selected" : ""}>${n}</option>`).join("")}
              <option value="__new_guest" ${p.is_guest ? "selected" : ""}>+ 新增來賓</option>
            </select>
          `}
          ${p.is_guest ? `<input data-i="${i}" type="text" class="guestInput flex-1 border rounded p-2 text-sm" value="${p.name}" placeholder="來賓姓名">` : ""}
          <label class="flex items-center gap-1 text-xs whitespace-nowrap cursor-pointer">
            <input type="checkbox" data-i="${i}" class="guestToggle" ${p.is_guest ? "checked" : ""}>
            來賓
          </label>
          <button data-i="${i}" class="pdel text-red-500 font-bold">✕</button>
        </div>
        `;
      }).join("")}
    </div>
    <button id="addRow" class="w-full bg-primary text-white rounded-lg py-2 font-semibold text-sm">+ 加入球員</button>
  </div>
  ${navBtns(true, S.players.length > 0, `開始輸入（${S.players.length} 人）`)}`;

  // 變更會員/來賓選擇（名字匹配候選）
  document.querySelectorAll(".candSel").forEach(sel => sel.onchange = e => {
    const i = +e.target.dataset.i;
    const v = e.target.value;
    const isGuest = e.target.options[e.target.selectedIndex]?.dataset.guest === "true";
    if (v.startsWith("新增來賓：")) {
      S.players[i].name = v.substring(5);  // 去掉前綴
      S.players[i].is_guest = true;
    } else if (v) {
      S.players[i].name = v;
      S.players[i].is_guest = isGuest;
    }
    S.players[i].ocr.nameMatch = "resolved";  // 標記已處理
    render();
  });

  // 變更會員/來賓選擇（一般下拉）
  document.querySelectorAll(".psel").forEach(sel => sel.onchange = e => {
    const i = +e.target.dataset.i;
    const v = e.target.value;
    if (v === "__new_guest") {
      S.players[i].is_guest = true;
      S.players[i].name = "";
    } else if (v) {
      S.players[i].name = v;
      S.players[i].is_guest = false;
    }
    render();
  });

  // 來賓名稱輸入
  document.querySelectorAll(".guestInput").forEach(inp => inp.oninput = e => {
    const i = +e.target.dataset.i;
    S.players[i].name = e.target.value.trim();
    save();
  });

  // 來賓開關
  document.querySelectorAll(".guestToggle").forEach(chk => chk.onchange = e => {
    const i = +e.target.dataset.i;
    S.players[i].is_guest = e.target.checked;
    render();
  });

  // 刪除行
  document.querySelectorAll(".pdel").forEach(btn => btn.onclick = () => {
    const i = +btn.dataset.i;
    const filled = S.players[i].scores.some(v => v != null);
    if (filled && !confirm(`${S.players[i].name} 已有輸入成績，確定移除？`)) return;
    S.players.splice(i, 1);
    render();
  });

  // 加入行
  $("addRow").onclick = () => {
    S.players.push({ name: "", is_guest: false, scores: Array(18).fill(null) });
    render();
  };
}

// ------------------ ③ 單人逐洞輸入 ------------------

const sum = arr => arr.some(v => v == null) ? null : arr.reduce((a, b) => a + b, 0);
const partial = arr => arr.reduce((a, b) => a + (b ?? 0), 0);

function renderStep3() {
  if (!S.players.length) { S.step = 2; return render(); }
  S.cur.p = Math.min(S.cur.p, S.players.length - 1);
  const P = S.players[S.cur.p];
  const h = S.cur.h;
  const front = P.scores.slice(0, 9), back = P.scores.slice(9);
  const done = P.scores.filter(v => v != null).length;

  // 色碼（設計要求 6）：綠=OCR 驗證通過、黃=低信心待校對、紅=無法辨識待補
  const ocr = P.ocr;
  const cellColor = (v, i) => {
    if (ocr) {
      if (v == null && ocr.unread.includes(i)) return "bg-red-200 text-accent border-accent";
      if (v != null && ocr.low.includes(i)) return "bg-yellow-300 text-gray-900";
      if (v != null && ocr.validation === "pass") return "bg-green-600 text-white";
    }
    return v == null ? "bg-gray-100 text-gray-400" : "bg-primary text-white";
  };
  const pill = (v, i) => `
    <button data-h="${i}" class="cell key shrink-0 w-9 h-11 rounded-lg text-sm font-bold border
      ${i === h ? "border-accent ring-2 ring-accent/40 " : "border-gray-200 "}
      ${cellColor(v, i)}">${v ?? (i + 1)}</button>`;

  app().innerHTML = `
  <div class="bg-white rounded-xl shadow p-3">
    <div class="flex items-center justify-between gap-2">
      <select id="pSel" class="font-bold text-primary text-lg bg-transparent max-w-[45%]">
        ${S.players.map((p, i) => `<option value="${i}" ${i === S.cur.p ? "selected" : ""}>
          ${p.name}${p.is_guest ? "（賓）" : ""} ${p.scores.every(v => v != null) ? "✓" : ""}</option>`).join("")}
      </select>
      <div class="text-right text-sm leading-tight">
        <div class="text-gray-500">進度 <b class="text-primary">${done}</b>/18</div>
        <div class="font-mono">
          <span class="text-gray-500">${S.nineNames[0]}</span> <b>${sum(front) ?? partial(front) + "…"}</b>
          <span class="text-gray-500 ml-1">${S.nineNames[1]}</span> <b>${sum(back) ?? partial(back) + "…"}</b>
          <span class="text-accent font-bold ml-1">Σ${sum(P.scores) ?? partial(P.scores) + "…"}</span>
        </div>
      </div>
    </div>

    <div class="mt-3 flex gap-1 overflow-x-auto pb-1">
      ${front.map((v, i) => pill(v, i)).join("")}
      <div class="shrink-0 w-px bg-gray-300 mx-1"></div>
      ${back.map((v, i) => pill(v, i + 9)).join("")}
    </div>

    <div class="text-center my-3">
      <span class="text-4xl font-black text-primary">第 ${h + 1} 洞</span>
      <span class="text-2xl text-gray-400 font-bold ml-2">par ${S.holePars[h]}</span>
      ${P.scores[h] != null ? `<span class="text-2xl text-accent font-bold ml-2">＝${P.scores[h]}</span>` : ""}
    </div>

    <div id="keypad" class="grid grid-cols-4 gap-2">${tensMode
      ? [10, 11, 12, 13, 14, 15].map(n =>
          `<button data-v="${n}" class="kv key bg-primary text-white text-2xl font-bold rounded-xl py-4">${n}</button>`).join("") +
        `<button id="tensCancel" class="key col-span-2 bg-gray-200 rounded-xl py-4 font-bold text-gray-600">取消</button>`
      : [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n =>
          `<button data-v="${n}" class="kv key text-2xl font-bold rounded-xl py-4
             ${n === S.holePars[h] ? "bg-accent text-white" : "bg-gray-800 text-white"}">${n}</button>`).join("") +
        `<button id="tens" class="key bg-gray-500 text-white rounded-xl py-4 font-bold">10+</button>
         <button id="parKey" class="key col-span-2 bg-primary text-white rounded-xl py-4 font-bold text-lg">照 par（${S.holePars[h]}）</button>
         <button id="bsKey" class="key bg-gray-200 text-gray-600 rounded-xl py-4 font-bold text-xl">⌫</button>`}
    </div>
    <p class="text-xs text-gray-400 text-center mt-2">單鍵輸入後自動跳下一洞；點上方格子可跳任一洞修改</p>
  </div>
  ${navBtns(true, true, "檢視總表")}`;

  $("pSel").onchange = e => { S.cur.p = +e.target.value; S.cur.h = firstEmpty(S.players[S.cur.p]); tensMode = false; render(); };
  document.querySelectorAll(".cell").forEach(b => b.onclick = () => { S.cur.h = +b.dataset.h; tensMode = false; render(); });
  document.querySelectorAll(".kv").forEach(b => b.onclick = () => setScore(+b.dataset.v));
  if (tensMode) { $("tensCancel").onclick = () => { tensMode = false; render(); }; }
  else {
    $("tens").onclick = () => { tensMode = true; render(); };
    $("parKey").onclick = () => setScore(S.holePars[S.cur.h]);
    $("bsKey").onclick = () => {
      const P = S.players[S.cur.p];
      P.scores[S.cur.h] = null;
      clearOcrFlag(P, S.cur.h);
      render();
    };
  }
}

function firstEmpty(P) {
  const i = P.scores.findIndex(v => v == null);
  return i < 0 ? 0 : i;
}

function clearOcrFlag(P, h) {
  // 總幹事人工校對過的格子即脫離黃/紅標記
  if (P.ocr) {
    P.ocr.low = P.ocr.low.filter(x => x !== h);
    P.ocr.unread = P.ocr.unread.filter(x => x !== h);
  }
}

function setScore(v) {
  const P = S.players[S.cur.p];
  P.scores[S.cur.h] = v;
  clearOcrFlag(P, S.cur.h);
  tensMode = false;
  if (S.cur.h < 17) {
    S.cur.h++;
  } else if (P.scores.every(x => x != null)) {
    // 18 洞填完 → 自動跳下一位未完成球員
    const nxt = S.players.findIndex(p => !p.scores.every(x => x != null));
    if (nxt >= 0) { S.cur.p = nxt; S.cur.h = firstEmpty(S.players[nxt]); }
    else { S.step = 4; }   // 全員完成 → 總表
  }
  render();
}

function renderStep4() {
  const rows = S.players.map((p, i) => {
    const done = p.scores.filter(v => v != null).length;

  document.querySelectorAll(".prow").forEach(tr => tr.onclick = () => {

// 同分預檢：會員以名冊差點算淨桿，「淨桿同且差點同」群組需總幹事裁定
function tieGroups() {
  const roster = Object.fromEntries((rules.players || []).map(p => [p.name, p.handicap]));
  const members = S.players.filter(p => !p.is_guest && roster[p.name] != null
                                        && p.scores.every(v => v != null));
  const byKey = {};
  for (const p of members) {
    const gross = p.scores.reduce((a, b) => a + b, 0);
    const hc = roster[p.name];
    const key = `${gross - hc}|${hc}`;
    (byKey[key] = byKey[key] || []).push({ name: p.name, net: gross - hc, handicap: hc });
  }
  return Object.values(byKey).filter(g => g.length > 1);
}

function tiesResolved() {
  return tieGroups().every(g => g.every(m => S.manualTieOrder.includes(m.name)));
}

function buildConfirmedJSON() {
  return {
    date: S.date,
    course: S.courseName,
    course_par: S.coursePar,
    front_nine_name: S.nineNames[0],
    back_nine_name: S.nineNames[1],
    hole_pars: [...S.holePars],
    source: "手動輸入（admin.html）",
    manual_awards: { near_pin: S.nearPin.length ? [...S.nearPin] : null },
    ...(S.manualTieOrder.length ? { manual_tie_order: [...S.manualTieOrder] } : {}),
    players: S.players.map(p => {
      const front = p.scores.slice(0, 9), back = p.scores.slice(9);
      const gross = sum(p.scores);
      return {
        name: p.name, is_guest: p.is_guest,
        front_9: front, back_9: back,
        front_9_total: sum(front), back_9_total: sum(back),
        gross, vs_par: gross != null ? gross - S.coursePar : null,
        validation: gross != null ? "pass" : "fail",
      };
    }),
  };
}

  const guests = S.players.filter(p => p.is_guest).length;
  app().innerHTML = `
  <div class="space-y-4">

    <h2 class="font-bold text-blue-700 mb-3">📊 本場人員確認</h2>
    <div class="grid grid-cols-3 gap-4 text-center">
      <div>
        <div class="text-2xl font-bold text-primary">${S.players.length}</div>

      </div>
      <div>
        <div class="text-2xl font-bold text-primary">${members.length}</div>

    </div>
    <div class="mt-3 p-3 bg-white rounded-lg text-sm text-gray-700 border-l-4 border-blue-400">
      ✓ 將進行淨桿排名計算，排名對象為 <b>${members.length}</b> 位會員；來賓成績保留存查，不列入排名與獎項。
    </div>
    <button id="summaryConfirm" class="w-full mt-3 bg-blue-500 hover:bg-blue-600 text-white rounded-lg py-2 font-semibold text-sm">確認無誤，繼續</button>
  </div>
  <div class="bg-white rounded-xl shadow p-4">
    <h2 class="font-bold text-primary mb-2">🎯 近洞獎（現場人工判定，可複選）</h2>
    <div class="flex gap-2 flex-wrap">${members.map(p => `
      <button data-np="${p.name}" class="npBtn key px-4 py-2 rounded-full border font-semibold text-sm
        ${S.nearPin.includes(p.name) ? "bg-accent text-white border-accent" : "bg-white text-gray-700"}">${p.name}</button>`).join("")}
    </div>
  </div>
  ${tieCard}
  <div class="bg-white rounded-xl shadow p-4 space-y-3">
    <h2 class="font-bold text-primary">確認稿預覽 <span class="text-sm text-gray-400 font-normal">${path}</span></h2>
    <textarea id="jsonOut" readonly class="w-full h-40 border rounded-lg p-2 font-mono text-xs bg-gray-50">${JSON.stringify(data, null, 2)}</textarea>
    <div class="text-sm text-gray-500 leading-relaxed">

      <button id="pubBtn" ${resolved ? "" : "disabled"}
        class="flex-1 rounded-xl py-3 font-bold text-white ${resolved ? "bg-accent" : "bg-gray-300"}">
        ${resolved ? (hasPat ? "🚀 一鍵發布" : "設定 PAT 後發布") : "同分待裁定"}</button>
    </div>
    <div id="pubLog" class="text-sm font-mono whitespace-pre-wrap"></div>

  const summaryConfirm = $("summaryConfirm");
  if (summaryConfirm) {
    summaryConfirm.onclick = () => {

      $("summaryConfirm").classList.add("hidden");

    render();

  document.querySelectorAll(".tieBtn").forEach(b => b.onclick = () => {
    const n = b.dataset.tn;
    if (!S.manualTieOrder.includes(n)) { S.manualTieOrder.push(n); render(); }
  });
  const tr = $("tieReset");
  if (tr) tr.onclick = () => { S.manualTieOrder = []; render(); };

  $("dlBtn").onclick = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${S.date}_confirmed.json`;
    a.click();
  };
  $("pubBtn").onclick = () => hasPat ? doPublish(data, path) : openPat();
  $("resetBtn").onclick = () => {
    if (confirm("確定清除本場全部輸入？")) { localStorage.removeItem(DRAFT_KEY); S = newState(); render(); }
  };

async function ghFetch(url, opts = {}) {
  const pat = localStorage.getItem(PAT_KEY);
  const res = await fetch(`https://api.github.com${url}`, {
    ...opts,
    headers: {
      "Authorization": `Bearer ${pat}`,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(opts.headers || {}),
    },
  });
  return res;
}

async function doPublish(data, path) {
  const log = (m) => { $("pubLog").textContent += m + "\n"; };
  $("pubLog").textContent = "";
  $("pubBtn").disabled = true;
  try {
    // 同名檔已存在時需帶 sha 更新（重發布情境）
    let sha;
    const head = await ghFetch(`/repos/${REPO}/contents/${path}?ref=${BRANCH}`);
    if (head.ok) sha = (await head.json()).sha;

    log("① commit 確認稿…");
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    const put = await ghFetch(`/repos/${REPO}/contents/${path}`, {
      method: "PUT",
      body: JSON.stringify({
        message: `admin: ${S.date} 確認稿（${S.courseName}）`,
        content, branch: BRANCH, ...(sha ? { sha } : {}),
      }),
    });
    if (!put.ok) throw new Error(`commit 失敗 HTTP ${put.status}：${(await put.json()).message || ""}`);
    log("　✓ 已寫入 " + path);

    log("② 觸發計分 workflow…");
    const dispatchedAt = Date.now();
    const disp = await ghFetch(`/repos/${REPO}/actions/workflows/score.yml/dispatches`, {
      method: "POST",
      body: JSON.stringify({ ref: BRANCH, inputs: { input_path: path } }),
    });
    if (disp.status !== 204) throw new Error(`dispatch 失敗 HTTP ${disp.status}`);
    log("　✓ 已觸發，正在尋找對應的 Action 執行紀錄…");

    // workflow_dispatch 本身不回傳 run id，用剛觸發的時間比對 runs 清單，
    // 找不到（API 還沒更新）就退回該 workflow 的總覽頁，不擋發布流程。
    let runUrl = `https://github.com/${REPO}/actions/workflows/score.yml`;
    for (let i = 0; i < 4; i++) {
      await new Promise(r => setTimeout(r, 1500));
      try {
        const runsRes = await ghFetch(`/repos/${REPO}/actions/workflows/score.yml/runs?per_page=1`);
        if (runsRes.ok) {
          const run = (await runsRes.json()).workflow_runs?.[0];
          if (run && new Date(run.created_at).getTime() >= dispatchedAt - 5000) {
            runUrl = run.html_url;
            break;
          }
        }
      } catch (_) { /* 忽略，重試或用總覽頁 */ }
    }
    log("　✓ 完成");
    $("pubLog").insertAdjacentHTML("beforeend",
      `\n🎉 發布完成！計分結果請看：<a href="${runUrl}" target="_blank" rel="noopener" ` +
      `class="text-primary underline break-all">${runUrl}</a>\n`);
    localStorage.removeItem(DRAFT_KEY);   // 發布成功即清草稿
  } catch (e) {
    log(`\n❌ ${e.message}\n（確認稿未遺失，可重試或改用「下載 JSON」）`);
  } finally {
    $("pubBtn").disabled = false;
  }
}

// ------------------ PAT modal ------------------

function openPat() {
  $("patInput").value = localStorage.getItem(PAT_KEY) || "";
  $("patModal").classList.remove("hidden");
}
$("patBtn").onclick = openPat;
$("patClose").onclick = () => $("patModal").classList.add("hidden");
$("patSave").onclick = () => {
  const v = $("patInput").value.trim();
  if (v) localStorage.setItem(PAT_KEY, v);
  $("patModal").classList.add("hidden");
  if (S) render();
};
$("patClear").onclick = () => {
  localStorage.removeItem(PAT_KEY);
  $("patInput").value = "";
};

boot();
</script>
